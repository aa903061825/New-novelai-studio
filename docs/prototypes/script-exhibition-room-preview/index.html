<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>剧本展览室交互预览</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Studio navigation">
        <div class="brand">
          <span class="brand-mark">N</span>
          <div>
            <div class="brand-title">Novel Studio</div>
            <div class="brand-subtitle">本地创作工作室</div>
          </div>
        </div>
        <nav class="nav-list" aria-label="主导航">
          <button class="nav-item" type="button">主页</button>
          <button class="nav-item" type="button">素材库</button>
          <button class="nav-item is-active" type="button">剧本展览室</button>
          <button class="nav-item" type="button">工作台</button>
          <button class="nav-item" type="button">批量产线</button>
          <button class="nav-item" type="button">画廊</button>
          <button class="nav-item" type="button">设置</button>
        </nav>
        <div class="sidebar-status">
          <div class="status-dot"></div>
          <div>
            <div class="status-title">剧本索引</div>
            <div class="status-text" id="sidebarStatus">正在整理</div>
          </div>
        </div>
      </aside>

      <main class="workspace">
        <section class="page-header" aria-labelledby="pageTitle">
          <div class="page-icon">展</div>
          <div class="page-copy">
            <h1 id="pageTitle">剧本展览室</h1>
            <p id="pageSummary">
              按剧本收纳原始帧、批量跑图结果和单帧重跑图，像浏览素材库一样找回每次创作。
            </p>
          </div>
          <div class="header-metrics" aria-label="概览统计">
            <div>
              <strong id="metricScripts">0</strong>
              <span>剧本</span>
            </div>
            <div>
              <strong id="metricFrames">0</strong>
              <span>图片</span>
            </div>
            <div>
              <strong id="metricIncoming">0</strong>
              <span>新收纳</span>
            </div>
          </div>
        </section>

        <section id="controlPanel" class="control-panel" aria-label="浏览控制">
          <label class="search-box">
            <span>搜索</span>
            <input
              id="searchInput"
              type="search"
              placeholder="剧本名 / 角色 / 场景 / 批次"
              autocomplete="off"
            />
          </label>
          <div class="control-actions">
            <button id="saveCategoryButton" class="icon-button" type="button">
              保存到分类
            </button>
            <button id="newCategoryButton" class="icon-button" type="button">
              新建分类
            </button>
          </div>
          <div id="saveStatus" class="save-status" aria-live="polite"></div>
        </section>

        <section id="categoryStrip" class="category-strip" aria-label="分类"></section>
        <section id="contentArea" class="content-area" aria-live="polite"></section>
      </main>

      <aside id="detailDrawer" class="detail-drawer" aria-label="剧本详情"></aside>
    </div>

    <div id="lightbox" class="lightbox" aria-hidden="true">
      <button id="lightboxClose" class="lightbox-close" type="button">关闭</button>
      <div id="lightboxContent" class="lightbox-content"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>

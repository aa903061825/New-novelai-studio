name: novel_studio
description: Local-first creative workspace for NovelAI image workflows.
publish_to: 'none'
version: 1.0.22

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  adaptive_theme: ^3.6.0
  archive: ^3.1.2
  blinking_text: ^1.0.4
  device_info_plus: ^10.1.0
  easy_localization: ^3.0.7
  encrypt: ^5.0.3
  file_picker: ^8.0.3
  flutter_command: ^7.2.2
  flutter_markdown_plus: ^1.0.0+1
  get_it: ^8.0.3
  hive: ^2.2.3
  http: ^1.2.1
  image: ^4.2.0
  image_picker: ^1.1.2
  image_size_getter: ^2.1.3
  package_info_plus: ^8.0.1
  path_provider: ^2.0.1
  permission_handler: ^11.3.1
  png_chunks_extract: ^1.0.2
  provider: ^6.1.2
  saver_gallery: ^3.0.5
  super_clipboard: ^0.8.19
  super_drag_and_drop: ^0.8.19
  url_launcher: ^6.2.6
  uuid: ^4.5.1
  waterfall_flow: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  crypto: ^3.0.6
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/json/example.json
    - assets/json/legacy_codex_seed.json
    - assets/json/legacy_artist_studio_seed.json
    - assets/appicon.png
    - assets/qrcode1.jpg
    - assets/qrcode2.jpg
    - assets/l10n/en.json
    - assets/l10n/zh-CN.json

  uses-material-design: true

flutter_intl:
  enabled: false
